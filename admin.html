<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor | cyberhayde.log</title>
<link rel="stylesheet" href="style.css">
<style>
  body{animation:none; background:var(--bg); min-height:100vh;}
  .bar{position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 20px; background:rgba(12,18,32,.95); border-bottom:1px solid var(--line);}
  .bar h1{font:600 14px var(--mono); color:var(--cyan); margin-right:auto;}
  #status{font:12px var(--mono); color:var(--muted);}
  #status.warn{color:var(--amber);} #status.ok{color:var(--cyan);} #status.err{color:var(--danger);}
  .layout{display:grid; grid-template-columns:200px 1fr; gap:24px; max-width:1100px; margin:0 auto; padding:24px 20px 80px;}
  aside{position:sticky; top:80px; align-self:start; display:flex; flex-direction:column; gap:4px;}
  aside button{text-align:left; font:13px var(--mono); color:var(--muted); background:none; border:0; padding:9px 12px; border-radius:8px; cursor:pointer;}
  aside button:hover{background:rgba(255,255,255,.05); color:var(--text);}
  aside button.on{background:rgba(82,209,200,.1); color:var(--cyan);}
  main{min-width:0;}
  main h2{font:700 1.6rem var(--display); margin-bottom:16px; text-transform:capitalize;}
  label{display:block; font:12px var(--mono); color:var(--muted); margin:12px 0 5px; text-transform:capitalize;}
  input,textarea,select{width:100%; background:#0e1626; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:14px var(--body);}
  textarea{min-height:84px; resize:vertical; line-height:1.5;}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--cyan);}
  fieldset{border:1px solid var(--line); border-radius:var(--radius); padding:6px 16px 16px; margin:14px 0;}
  legend{font:600 12px var(--mono); color:var(--amber); padding:0 8px; text-transform:capitalize;}
  details{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:10px 0;}
  summary{display:flex; align-items:center; gap:6px; padding:11px 14px; cursor:pointer; font:500 14px var(--body); list-style:none;}
  summary span.t{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  details .body{padding:0 16px 16px;}
  .ib{background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:3px 8px; font:12px var(--mono); cursor:pointer;}
  .ib:hover{color:var(--text); border-color:var(--muted-2);} .ib.del:hover{color:var(--danger); border-color:var(--danger);}
  .row{display:flex; gap:6px; align-items:flex-start; margin:6px 0;} .row > :first-child{flex:1;}
  .add{margin-top:8px;}
  .img-row{display:flex; gap:10px; align-items:center;} .img-row img{width:56px; height:56px; object-fit:contain; background:#0e1626; border:1px solid var(--line); border-radius:8px;}
  .btn{padding:8px 14px; font-size:12px;}
  dialog{background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:var(--radius); padding:24px; width:min(480px,92vw);}
  dialog::backdrop{background:rgba(0,0,0,.6);} dialog p{font-size:13px; color:var(--muted); margin-bottom:6px;}
  @media (max-width:760px){.layout{grid-template-columns:1fr;} aside{position:static; flex-direction:row; flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="bar">
  <h1>cyberhayde.log / editor</h1>
  <span id="status">loading...</span>
  <button class="btn btn-ghost" id="bPrev">Preview</button>
  <button class="btn btn-ghost" id="bDl">Download JSON</button>
  <button class="btn btn-ghost" id="bImp">Import JSON</button>
  <button class="btn btn-ghost" id="bReset">Reload live</button>
  <button class="btn btn-ghost" id="bSet">Settings</button>
  <button class="btn btn-primary" id="bPub">Publish</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
  <input type="file" id="fImg" accept="image/*" hidden>
</div>
<div class="layout"><aside id="nav"></aside><main id="main"></main></div>

<dialog id="dlg">
  <h2 style="font:700 1.2rem var(--display);margin-bottom:8px">Publish settings</h2>
  <p>Create a fine-grained token at github.com/settings/personal-access-tokens, limited to this one repository, with Contents set to Read and write. It stays in this browser only.</p>
  <label>Owner</label><input id="cOwner">
  <label>Repository</label><input id="cRepo">
  <label>Branch</label><input id="cBranch">
  <label>Token</label><input id="cToken" type="password" autocomplete="off">
  <div class="row" style="margin-top:18px"><span></span><button class="btn btn-ghost" id="cCancel">Cancel</button><button class="btn btn-primary" id="cSave">Save</button></div>
</dialog>
<script type="module" src="js/admin.js"></script>
</body>
</html>
